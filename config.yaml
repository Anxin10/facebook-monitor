# Facebook 監控系統設定檔
# 瀏覽器安裝與操作請參閱 BROWSER_SETUP.md

# 監控目標清單
targets:
  - page_id: "100054441671873"
    url: "https://www.facebook.com/profile.php?id=100054441671873"
    account_type: "page_assumed"
    enabled: true

# 貼文監控設定
posts:
  source: "browser"

# 限時動態設定（尚未實作）
stories:
  enabled: false
  source: "pending_validation"
  interval_seconds: 300

# 資料儲存設定
storage:
  database: "monitor.sqlite3"
  download_media: false
  max_items_retention_days: 365

# 通知設定
notifications:
  timezone: Asia/Taipei
  notify_existing_on_first_run: false  # 首次基準不通知既有內容
  notify_post_edits: false
  channels: []
  # 範例：
  # channels:
  #   - id: telegram_main
  #     backend: apprise
  #     url_env: TELEGRAM_APPRISE_URL
  #   - id: email_main
  #     backend: apprise
  #     url_env: EMAIL_APPRISE_URL
  #   - id: line_main
  #     backend: line
  #     token_env: LINE_CHANNEL_ACCESS_TOKEN
  #     recipient_env: LINE_TO

# 日誌設定
logging:
  level: "INFO"
  file: "monitor.log"
  max_size_mb: 10
  backup_count: 3

# 執行環境設定
runtime:
  max_concurrent_fetchers: 3
  retry_max_attempts: 5
  retry_base_delay_seconds: 30
  respect_rate_limit: true
