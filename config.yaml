posts:
  source: background_browser
  interval_seconds: 300
stories:
  enabled: false
  source: pending_validation
  interval_seconds: 300
storage:
  database: monitor.sqlite3
  download_media: false
  max_items_retention_days: 365
notifications:
  timezone: Asia/Taipei
  notify_existing_on_first_run: false
  notify_post_edits: false
  channels:
  - id: telegram_main
    backend: apprise
    url_env: TELEGRAM_APPRISE_URL
  - id: line_main
    backend: line
    token_env: LINE_CHANNEL_ACCESS_TOKEN
    recipient_env: LINE_TO
logging:
  level: INFO
  file: monitor.log
  max_size_mb: 10
  backup_count: 3
runtime:
  max_concurrent_fetchers: 3
  retry_max_attempts: 5
  retry_base_delay_seconds: 30
  respect_rate_limit: true
